[package]
name = "leopardwm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line interface for controlling LeopardWM"
# Both binaries are thin entry points over src/lib.rs, so implicit bin
# discovery would only rediscover them under the same names.
autobins = false

[[bin]]
name = "leopardwm-cli"
path = "src/bin/leopardwm-cli.rs"

# Short alias — same entry point, just a faster name to type. Distribution
# channels ship both binaries.
[[bin]]
name = "lwm"
path = "src/bin/lwm.rs"

[dependencies]
leopardwm-ipc = { path = "../ipc" }
leopardwm-platform-win32 = { path = "../platform_win32" }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
windows = { workspace = true }
winreg = "0.56"

[dev-dependencies]

[lints]
workspace = true
